```yaml
name: Regenerate package-lock

on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate package-lock.json
      run: |
        rm -f package-lock.json
        npm install --package-lock-only --prefer-offline --no-audit --no-fund

    - name: Commit package-lock.json if changed
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if ! git diff --quiet -- package-lock.json; then
          git add package-lock.json
          git commit -m "chore: regenerate package-lock.json to match package.json [skip ci]"
          git push origin HEAD:main
        else
          echo "package-lock.json is up to date"
        fi

    - name: Install dependencies (verify)
      run: npm ci

    - name: Verify TypeScript Build
      run: npm run build --if-present
```
